global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'curatix-monitor'

scrape_configs:
  - job_name: 'curatix-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'curatix'
          service: 'backend'
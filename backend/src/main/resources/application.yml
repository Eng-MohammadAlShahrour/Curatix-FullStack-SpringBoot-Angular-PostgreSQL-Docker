spring:
  application:
    name: museum-loan

  datasource:
    url: jdbc:postgresql://db:5432/curatix
    username: curatix
    password: curatix_secret_2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    username: no-reply@curatix.test
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: curatix
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: curatix-dev-secret-change-in-production-please-use-strong-key-here
  expiration-ms: 86400000

curatix:
  email:
    enabled: false

logging:
  level:
    com.curatix: INFO
    org.springframework.security: WARN
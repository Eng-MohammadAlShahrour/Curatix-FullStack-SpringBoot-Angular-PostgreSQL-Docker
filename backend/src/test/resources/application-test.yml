spring:
  application:
    name: museum-loan-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-junit-testing-only-256-bits-long-enough-for-hs256
  expiration-ms: 3600000

logging:
  level:
    com.curatix: WARN
    org.springframework: WARN
    org.hibernate: WARN